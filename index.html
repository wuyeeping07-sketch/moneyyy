<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>記帳 App</title>
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="icon" type="image/jpeg" href="icon.jpg">
  <style>
    :root {
      /* 鮮明柔和奶黃色調 */
      --cream-bg: #fff7d6;        /* 滿版鮮明奶黃背景 */
      --cream-card: #ffffff;      /* 卡片純白背景 */
      --cream-header: #ffef99;    /* 標頭奶黃色 */
      --soft-yellow: #fde68a;     /* 亮奶黃色 */
      --accent-yellow: #facc15;   /* 強調黃色 */
      --border-color: #f3dc7b;    /* 邊框顏色 */
      --text-main: #3d3121;       /* 深棕色文字 */
      --text-muted: #85735d;      /* 淺棕色文字 */
      
      --green-bg: #dcfce7;
      --green-text: #15803d;
      --red-bg: #fee2e2;
      --red-text: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 強制禁止頁面橫向滾動溢出 */
    html, body {
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: var(--cream-bg);
      color: var(--text-main);
      padding-bottom: 24px;
      min-height: 100vh;
    }

    /* 可愛彈跳動畫 */
    @keyframes bounceIn {
      0% { transform: scale(0.92); opacity: 0; }
      70% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* Header & Navigation */
    header {
      background: var(--cream-header);
      padding: 10px 10px 12px 10px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 4px 12px rgba(210, 180, 80, 0.15);
      border-radius: 0 0 16px 16px;
      width: 100%;
    }

    .month-picker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .month-picker h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      background: var(--soft-yellow);
      border: 1.5px solid var(--accent-yellow);
      color: var(--text-main);
      border-radius: 10px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.15s ease;
    }

    .btn-icon:active {
      transform: scale(0.92);
      background: var(--accent-yellow);
    }

    /* Summary Bar */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      background: #fff;
      padding: 6px 4px;
      border-radius: 10px;
      text-align: center;
      border: 1.5px solid var(--border-color);
      width: 100%;
    }

    .summary-item {
      overflow: hidden;
    }

    .summary-item .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-item .value {
      font-size: 0.82rem;
      font-weight: 800;
      margin-top: 1px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      gap: 4px;
    }

    .btn-secondary {
      background: var(--soft-yellow);
      color: var(--text-main);
      border: 1.5px solid var(--accent-yellow);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-secondary:active {
      transform: scale(0.95);
    }

    /* Calendar Grid */
    .calendar-container {
      padding: 10px 4px;
      width: 100vw;
      max-width: 100vw;
      box-sizing: border-box;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      width: 100%;
    }

    .day-cell {
      background: var(--cream-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      min-height: 82px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(200, 180, 80, 0.08);
      animation: bounceIn 0.2s ease-out;
      overflow: hidden;
    }

    .day-cell:active {
      transform: scale(0.93);
      background: var(--soft-yellow);
    }

    .day-cell.empty {
      background: transparent;
      border: none;
      box-shadow: none;
      cursor: default;
    }

    .day-number {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* 日曆格內的文字標籤容器 */
    .day-text-badges {
      display: flex;
      flex-direction: column;
      gap: 1.5px;
      margin-top: 1px;
      width: 100%;
      overflow: hidden;
    }

    /* 分類文字標籤 */
    .day-text-badge {
      font-size: 0.52rem;
      color: #ffffff;
      font-weight: 700;
      padding: 1px 2px;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
      text-align: left;
    }

    .amount-info {
      font-size: 0.58rem;
      text-align: right;
      width: 100%;
    }

    .spent-text {
      color: var(--red-text);
      font-weight: 700;
      font-size: 0.58rem;
      line-height: 1;
    }

    .remain-tag {
      padding: 1px 2px;
      border-radius: 4px;
      font-weight: 800;
      margin-top: 1px;
      display: block;
      font-size: 0.6rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
    }

    .remain-tag.safe {
      background: var(--green-bg);
      color: var(--green-text);
    }

    .remain-tag.over {
      background: var(--red-bg);
      color: var(--red-text);
    }

    /* Modal / Bottom Sheet */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(61, 49, 33, 0.45);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--cream-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      max-height: 85vh;
      overflow-y: auto;
      animation: bounceIn 0.25s ease-out;
      border-top: 4px solid var(--accent-yellow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 800;
    }

    .close-btn {
      background: var(--soft-yellow);
      border: 1px solid var(--accent-yellow);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      font-weight: 700;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.88rem;
      background: #fff;
      color: var(--text-main);
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: var(--accent-yellow);
      color: var(--text-main);
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    /* Category Pill */
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 0.7rem;
      color: #fff;
      font-weight: 800;
    }

    /* Expense List in Modal */
    .expense-list {
      margin-top: 12px;
      border-top: 2px dashed var(--border-color);
      padding-top: 10px;
    }

    .expense-list h4 {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.82rem;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--red-text);
      font-size: 0.72rem;
      cursor: pointer;
      margin-left: 6px;
      font-weight: 800;
    }

    .cat-budget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cat-budget-row input {
      width: 80px;
      padding: 4px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      text-align: right;
      font-size: 0.82rem;
      background: #fff;
    }

    /* 分類預算餘額卡片樣式 */
    .balance-card {
      background: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .balance-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .balance-values {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <header>
    <div class="month-picker">
      <button class="btn-icon" onclick="changeMonth(-1)">&lt;</button>
      <h2 id="currentMonthTitle">2026 年 8 月 🐱</h2>
      <button class="btn-icon" onclick="changeMonth(1)">&gt;</button>
    </div>

    <div class="summary-grid">
      <div class="summary-item">
        <div class="label">本月總預算</div>
        <div class="value" id="dispTotalBudget">$0</div>
      </div>
      <div class="summary-item">
        <div class="label">本月已消費</div>
        <div class="value" style="color: var(--red-text);" id="dispTotalSpent">$0</div>
      </div>
      <div class="summary-item">
        <div class="label">本月總剩餘</div>
        <div class="value" style="color: var(--green-text);" id="dispTotalRemain">$0</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn-secondary" onclick="openBalanceOverviewModal()">📊 所有預算餘額</button>
      <button class="btn-secondary" onclick="openBudgetModal()">⚙️ 設定預算</button>
    </div>
  </header>

  <main class="calendar-container">
    <div class="weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </main>

  <!-- 所有分類預算餘額總覽彈窗 -->
  <div class="modal" id="balanceOverviewModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📊 本月所有分類預算餘額</h3>
        <button class="close-btn" onclick="closeBalanceOverviewModal()">&times;</button>
      </div>
      <div id="balanceListContainer"></div>
    </div>
  </div>

  <!-- 類別預算設定彈窗 -->
  <div class="modal" id="budgetModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🎨 各分類每月預算設定</h3>
        <button class="close-btn" onclick="closeBudgetModal()">&times;</button>
      </div>
      <div id="catBudgetInputs"></div>
      <button class="btn-submit" style="margin-top:12px;" onclick="saveCatBudgets()">儲存分類預算</button>
    </div>
  </div>

  <!-- 日期明細與新增消費彈窗 -->
  <div class="modal" id="dayModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalDateTitle">2026-08-05 📝</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <form onsubmit="addExpense(event)">
        <div class="form-group">
          <label>消費金額 ($)</label>
          <input type="number" id="expAmount" step="any" placeholder="例如: 120" required>
        </div>
        <div class="form-group">
          <label>消費類別</label>
          <select id="expCategory"></select>
        </div>
        <div class="form-group">
          <label>備註（選填）</label>
          <input type="text" id="expNote" placeholder="例如: 鼓棒 / 午餐便當">
        </div>
        <button type="submit" class="btn-submit">➕ 新增消費記錄</button>
      </form>

      <div class="expense-list">
        <h4>當日消費明細</h4>
        <div id="expenseItemsContainer" style="margin-top: 6px;"></div>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = {
      "飲食": "#f97316",
      "交通": "#06b6d4",
      "額外消費": "#64748b",
      "玩樂": "#a855f7",
      "禮物": "#ec4899",
      "電子": "#0284c7",
      "旅行": "#f59e0b",
      "日用": "#10b981",
      "打鼓": "#ef4444",
      "興趣班": "#6366f1"
    };

    let currentDate = new Date(2026, 7, 1); // 2026 年 8 月
    let selectedDateStr = "";

    // 預設將所有分類預算皆設置為 0
    let db = JSON.parse(localStorage.getItem('cream_budget_app_data_v6')) || {
      catBudgets: {
        "飲食": 0, "交通": 0, "額外消費": 0, "玩樂": 0,
        "禮物": 0, "電子產品": 0, "旅行": 0, "日用": 0,
        "打鼓": 0, "興趣班": 0
      },
      expenses: []
    };

    function saveData() {
      localStorage.setItem('cream_budget_app_data_v6', JSON.stringify(db));
    }

    function getMonthKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      return `${y}-${m}`;
    }

    function getTotalMonthlyBudget() {
      return Object.values(db.catBudgets).reduce((a, b) => a + (parseFloat(b) || 0), 0);
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderApp();
    }

    function renderApp() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthKey = getMonthKey(currentDate);

      document.getElementById('currentMonthTitle').innerText = `${year} 年 ${month + 1} 月 🐱`;
      
      const totalBudget = getTotalMonthlyBudget();
      const monthExpenses = db.expenses.filter(e => e.date.startsWith(monthKey));
      const totalSpent = monthExpenses.reduce((sum, e) => sum + e.amount, 0);
      const totalRemain = totalBudget - totalSpent;

      document.getElementById('dispTotalBudget').innerText = `$${Math.round(totalBudget).toLocaleString()}`;
      document.getElementById('dispTotalSpent').innerText = `$${Math.round(totalSpent).toLocaleString()}`;
      document.getElementById('dispTotalRemain').innerText = `$${Math.round(totalRemain).toLocaleString()}`;

      const daysGrid = document.getElementById('daysGrid');
      daysGrid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        daysGrid.appendChild(emptyCell);
      }

      const baseDailyBudget = totalBudget / daysInMonth;
      let runningSpent = 0;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayExpenses = monthExpenses.filter(e => e.date === dateStr);
        const daySpent = dayExpenses.reduce((sum, e) => sum + e.amount, 0);

        const totalAllowanceSoFar = day * baseDailyBudget;
        runningSpent += daySpent;
        
        const dayEndRemaining = totalAllowanceSoFar - runningSpent;

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.onclick = () => openModal(dateStr);

        let textBadgesHtml = '';
        if (dayExpenses.length > 0) {
          const catSums = {};
          dayExpenses.forEach(e => {
            catSums[e.category] = (catSums[e.category] || 0) + e.amount;
          });

          const catKeys = Object.keys(catSums);
          const showCats = catKeys.slice(0, 2);
          
          showCats.forEach(cat => {
            const color = CATEGORIES[cat] || '#64748b';
            const sumAmt = catSums[cat];
            textBadgesHtml += `<div class="day-text-badge" style="background-color: ${color};">${cat} $${Math.round(sumAmt)}</div>`;
          });

          if (catKeys.length > 2) {
            textBadgesHtml += `<div class="day-text-badge" style="background-color: #85735d;">+${catKeys.length - 2}種</div>`;
          }
        }

        const isOver = dayEndRemaining < 0;
        const remainClass = isOver ? 'over' : 'safe';

        cell.innerHTML = `
          <div>
            <div class="day-number">${day}</div>
            <div class="day-text-badges">${textBadgesHtml}</div>
          </div>
          <div class="amount-info">
            ${daySpent > 0 ? `<div class="spent-text">-${Math.round(daySpent)}</div>` : ''}
            <div class="remain-tag ${remainClass}">
              $${Math.round(dayEndRemaining)}
            </div>
          </div>
        `;
        daysGrid.appendChild(cell);
      }
    }

    function openBalanceOverviewModal() {
      const container = document.getElementById('balanceListContainer');
      container.innerHTML = '';

      const monthKey = getMonthKey(currentDate);
      const monthExpenses = db.expenses.filter(e => e.date.startsWith(monthKey));

      Object.keys(CATEGORIES).forEach(cat => {
        const budget = db.catBudgets[cat] || 0;
        const catExpenses = monthExpenses.filter(e => e.category === cat);
        const spent = catExpenses.reduce((sum, e) => sum + e.amount, 0);
        const remain = budget - spent;
        const color = CATEGORIES[cat];

        let percent = budget > 0 ? (spent / budget) * 100 : 0;
        let barColor = color;
        if (percent > 100) {
          barColor = "#ef4444";
        }

        const card = document.createElement('div');
        card.className = 'balance-card';
        card.innerHTML = `
          <div class="balance-header">
            <span class="cat-pill" style="background:${color};">${cat}</span>
            <span style="font-weight:800; font-size:0.85rem; color:${remain < 0 ? 'var(--red-text)' : 'var(--green-text)'}">
              ${remain < 0 ? '已超支 $' + Math.abs(Math.round(remain)) : '剩餘 $' + Math.round(remain)}
            </span>
          </div>
          <div class="balance-values">
            <span>已用: $${Math.round(spent)}</span>
            <span>預算: $${Math.round(budget)}</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${Math.min(percent, 100)}%; background-color: ${barColor};"></div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('balanceOverviewModal').classList.add('active');
    }

    function closeBalanceOverviewModal() {
      document.getElementById('balanceOverviewModal').classList.remove('active');
    }

    function initCategorySelect() {
      const select = document.getElementById('expCategory');
      select.innerHTML = '';
      Object.keys(CATEGORIES).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });
    }

    function openBudgetModal() {
      const container = document.getElementById('catBudgetInputs');
      container.innerHTML = '';
      Object.keys(CATEGORIES).forEach(cat => {
        const val = db.catBudgets[cat] || 0;
        const color = CATEGORIES[cat];
        const row = document.createElement('div');
        row.className = 'cat-budget-row';
        row.innerHTML = `
          <span class="cat-pill" style="background:${color};">${cat}</span>
          <div>$<input type="number" data-cat="${cat}" value="${val}"></div>
        `;
        container.appendChild(row);
      });
      document.getElementById('budgetModal').classList.add('active');
    }

    function closeBudgetModal() {
      document.getElementById('budgetModal').classList.remove('active');
    }

    function saveCatBudgets() {
      const inputs = document.querySelectorAll('#catBudgetInputs input');
      inputs.forEach(input => {
        const cat = input.getAttribute('data-cat');
        db.catBudgets[cat] = parseFloat(input.value) || 0;
      });
      saveData();
      closeBudgetModal();
      renderApp();
    }

    function openModal(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('modalDateTitle').innerText = `${dateStr} 📝`;
      document.getElementById('dayModal').classList.add('active');
      renderDayExpenses();
    }

    function closeModal() {
      document.getElementById('dayModal').classList.remove('active');
    }

    function addExpense(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('expAmount').value);
      const category = document.getElementById('expCategory').value;
      const note = document.getElementById('expNote').value;

      if (!amount) return;

      db.expenses.push({
        id: 'exp_' + Date.now(),
        date: selectedDateStr,
        amount: amount,
        category: category,
        note: note
      });

      saveData();
      document.getElementById('expAmount').value = '';
      document.getElementById('expNote').value = '';

      renderDayExpenses();
      renderApp();
    }

    function deleteExpense(id) {
      db.expenses = db.expenses.filter(e => e.id !== id);
      saveData();
      renderDayExpenses();
      renderApp();
    }

    function renderDayExpenses() {
      const container = document.getElementById('expenseItemsContainer');
      container.innerHTML = '';
      const dayExpenses = db.expenses.filter(e => e.date === selectedDateStr);

      if (dayExpenses.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:10px;">當天還沒有消費紀錄喔～ 🌿</div>';
        return;
      }

      dayExpenses.forEach(item => {
        const color = CATEGORIES[item.category] || '#64748b';
        const div = document.createElement('div');
        div.className = 'expense-item';
        div.innerHTML = `
          <div>
            <span class="cat-pill" style="background:${color};">${item.category}</span>
            <span style="margin-left:4px; font-weight:700;">${item.note || ''}</span>
          </div>
          <div>
            <span style="color:var(--red-text); font-weight:800;">-$${item.amount}</span>
            <button class="btn-delete" onclick="deleteExpense('${item.id}')">刪除</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    initCategorySelect();
    renderApp();
  </script>
</body>
</html>
